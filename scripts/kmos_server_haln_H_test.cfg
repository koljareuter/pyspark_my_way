# Smoke test of kmos_server_haln_H.cfg on ONE H OB (the first one, SPT2040, KMOS.2026-06-07T07:24:38.627: 6 OBJECT +
# 3 SKY frames, SKY 76-89 deg from OBJECT; the local test OB of the sky_align option), same procdir and settings as the
# full run (the full run redoes this OB with the same files). Takes about 20-30 min.
# On hqempower1:
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_haln_H_test.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/Haln_test && cd /local_storage/KOLJA/hyb_work/Haln_test
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#       -p $HOME/pyspark_my_way/scripts/kmos_server_haln_H_test.cfg > haln_Htest.out 2>&1
# Expected afterwards (python scripts/prepare_procdir_ohlin.py scripts/kmos_server_haln_H_test.cfg --status):
#   9 dc links, 9 sky/ cubes, 6 final _rv cubes, degree 2; 6 cubes in sky_align/ (ls .../sky_align/*.fits);
#   in the OB log six '-- sky_align: dc_KMOS... for dc_KMOS...' lines, six '-- Aligned SKY cube sky_align/...' lines
#   and no 'mean-angle SKY cube' warning; science/*_rv.fits carry ESO PYSPARK SKY ALIGN = T, the sky_align/ cubes
#   ESO PYSPARK SKY ALIGN DX1..DX24 (local values, docs/hybrid-sky.md: det 1 +0.2..+1.1 px, det 3 about -0.6 px).

[instrument]
obsband = H

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HALN
subdirs = KMOS.2026-06-07T07:24:38.627

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dc

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_H_n500004_nomean.fits
rvcorr = True
use_oh = True
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
# quadratic on purpose (linear slightly worse in H); the patched DRP then equals the standard DRP
lcorr_degree = 2
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
sky_cal_angle = object
# slitlet-end alignment of the SKY frames (pyspark/cubes/sky_align.py, docs/hybrid-sky.md 'Sky lines at the slitlet ends')
sky_align = True
sky_align_dx = measure
rv_mode = interp
