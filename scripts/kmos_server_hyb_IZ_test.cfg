# Smoke test of kmos_server_hyb_IZ.cfg on ONE IZ OB (the worst mismatched one, cosmos_0.6_0.8_h21.4, SKY frames
# 87-93 deg away), into its own procdir. Same settings as the full run. Takes about 20-30 min.
# Expected afterwards (python scripts/prepare_procdir_ohlin.py scripts/kmos_server_hyb_IZ_test.cfg --status):
#   9 dc links, 9 dcr_ frames, 9 sky/ cubes, 6 skysub_det cubes, 6 final _rv cubes, degree 1;
#   in the OB log: 'Hybrid sky: 6 of 6 OBJECT frames ...', six '-- Hybrid sky subtraction with skysub_det/...'
#   lines and no 'classic O - S' warning; science/*_rv.fits carry ESO PYSPARK SKY HYBRID = T and
#   ESO PYSPARK ROWCM DET2/DET3 RMS. The same OB was validated locally bit for bit up to the sky
#   subtraction (docs/hybrid-sky.md); the local _s cubes are in WSL ~/impl_test/e2e/procdir_C.
#
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hyb_IZ_test.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/IZtest && cd /local_storage/KOLJA/hyb_work/IZtest
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#       -p $HOME/pyspark_my_way/scripts/kmos_server_hyb_IZ_test.cfg > hyb_IZtest.out 2>&1

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HYBTEST
subdirs = KMOS.2026-02-12T06:02:50.540

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
row_commonmode_correct = True
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
use_oh = True
oh_spec_iz = /local_storage/EMPOWER_raw_data/input_all/static/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
