# Re-reduction of all YJ OBs with a LINEAR OH-line wavelength correction in kmos_sci_red (patched DRP,
# KMOS_LCORR_DEGREE) instead of the DRP's quadratic. See docs/oh-lcorr-linear-rereduction.md.
# OH_SPEC: the standard kmos_oh_spec_yj.fits (36 usable lines across the band); ZAP basis: pyspark default
# (ZAPv2_SVD_YJ_n500004, or the 600 s file for DIT 600), as in all YJ reductions so far.
#
# Starts from the detector-corrected frames and calibrations of /local_storage/KOLJA/PROCDIR, which
# scripts/prepare_procdir_ohlin.py links (one hop, absolute) into PROCDIR_OHLIN/<OB>/. Everything is
# written to PROCDIR_OHLIN; PROCDIR and kmos_ob_sorted are only read.
#
# One band per file on purpose (svd_path, oh_spec_<band> and lcorr_degree apply to the whole run).
# Run each band from its own working directory: kmos_sci_red writes its products and the temporary
# .sof into the current directory, and a failing OB deletes every *.sof there.
#
# On hqempower1 (after build_kmos_lcorr_drp.sh build + smoke and prepare_procdir_ohlin.py):
#   mkdir -p /local_storage/KOLJA/ohlin_work/YJ && cd /local_storage/KOLJA/ohlin_work/YJ
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_ohlin_YJ.cfg > ohlin_YJ.out 2>&1 &
#
# 45 OB folders (all YJ OBs of the census with at least one sky exposure).

[instrument]
obsband = YJ

[pathing]
