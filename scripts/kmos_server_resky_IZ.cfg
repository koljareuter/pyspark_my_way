# Re-run SKY SUBTRACTION and all later steps for IZ-band OBs with the corrected
# ZAP eigenbasis (mean spectrum zeroed).  See docs/zap-iz-svd-mean-bug.md.
#
# Calibrations, detector corrections and cube reconstruction are NOT redone: the
# un-sky-subtracted cubes already in PROCDIR/<OB>/sky/ are re-used.  The products
# science/*_s.fits, *_s_i.fits, *_s_i_bkg2d.fits, *_s_i_bkg2d_rv.fits are overwritten.
#
# The 7 OB folders without sky/ cubes on the server are in
# scripts/kmos_server_resky_IZ_rebuild.cfg (they need the cubes rebuilt first).
#
# One band per file on purpose: svd_path applies to every band of a run, so this file
# must never contain YJ.
#
# On hqempower1, from ~/pyspark_my_way:
#   git pull
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_IZ.cfg            # preflight
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_IZ.cfg --backup   # optional copy of old *_rv.fits
#   nohup env PYTHONPATH=. python scripts/reduce_kmos.py -p scripts/kmos_server_resky_IZ.cfg > resky_IZ.out 2>&1 &
#
# 76 OB folders (COSMOS + GOODS/CDFS, January-February 2026).

