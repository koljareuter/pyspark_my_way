# Rerun Jan 12-14 OBs with telluric (standard star) correction.
# The original run used rerun_from_sky.py which skipped make_standard.
# This config reruns the full pipeline including standard star.
#
# Usage on hqempower1 (from ~/pyspark_my_way, main branch):
#   git pull
#   PYTHONPATH=. nohup python scripts/reduce_kmos.py -p scripts/kmos_server_jan_telluric.cfg > ~/reduce_jan_telluric.log 2>&1 &

[instrument]
obsband = YJ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /home/kreuter/kmos_ob_proc
subdirs = KMOS.2026-01-12T05:36:55.243,
          KMOS.2026-01-12T06:45:08.816,
          KMOS.2026-01-12T07:43:30.915,
          KMOS.2026-01-12T08:40:54.192,
          KMOS.2026-01-12T09:16:07.233,
          KMOS.2026-01-13T02:54:58.606,
          KMOS.2026-01-13T03:42:28.829,
          KMOS.2026-01-13T04:40:23.303,
          KMOS.2026-01-13T05:31:25.984,
          KMOS.2026-01-13T06:31:57.158,
          KMOS.2026-01-13T07:19:42.798,
          KMOS.2026-01-13T08:07:27.815,
          KMOS.2026-01-14T00:54:55.251,
          KMOS.2026-01-14T01:42:33.717,
          KMOS.2026-01-14T04:24:47.207,
          KMOS.2026-01-14T06:26:45.312,
          KMOS.2026-01-14T07:14:41.408,
          KMOS.2026-01-14T08:02:33.336

[detector]
channel_correct  = True
picture_correct  = True
prefix           = dc

[calibration]
make_dark       = False
make_flat       = False
make_arc        = False
make_illum      = False
reconstruct_arc = False
make_standard   = True
darkexp         = 300

[cubes]
reconstruct_cubes = True
sky_method        = zapv2
rvcorr            = True
use_oh            = True
illum_corr        = True
bkg_corr          = True
telluric_in_sof   = True
get_star_params   = False
star_prefix       = None
