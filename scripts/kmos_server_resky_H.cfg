# Re-run SKY SUBTRACTION and all later steps for H-band OBs with the corrected
# ZAP eigenbasis (mean spectrum zeroed).  See docs/zap-iz-svd-mean-bug.md.
#
# Calibrations, detector corrections and cube reconstruction are NOT redone: the
# un-sky-subtracted cubes already in PROCDIR/<OB>/sky/ are re-used.  The products
# science/*_s.fits, *_s_i.fits, *_s_i_bkg2d.fits, *_s_i_bkg2d_rv.fits are overwritten.
#
# One band per file on purpose: svd_path applies to every band of a run, so this file
# must never contain YJ.
#
# On hqempower1, from ~/pyspark_my_way:
#   git pull
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_H.cfg            # preflight
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_H.cfg --backup   # optional copy of old *_rv.fits
#   nohup env PYTHONPATH=. python scripts/reduce_kmos.py -p scripts/kmos_server_resky_H.cfg > resky_H.out 2>&1 &
#
# 18 OB folders (SPT2040 + XMM2215, June-August 2026).

