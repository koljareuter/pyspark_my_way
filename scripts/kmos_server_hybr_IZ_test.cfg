# IZ full re-run smoke test (1 OB) with everything adopted so far, alternative to the sky-only kmos_server_hybe_IZ_test.cfg (2026-11-03):
#   - row common mode on detectors 1, 2 and 3 with row_commonmode_minpix = 30 (grow 1): with minpix 150 almost no
#     det-1 row was corrected (det 1 has only 49-54 usable pixels per row at grow 1). Local test on 3 IZ OBs: aperture
#     noise of the det-1 cubes (IFUs 1-8) x0.87-0.96 depending on OB and estimator, most at the blue end (x0.85 at
#     0.81 um); IFUs 9-24 bit-identical; no flux change, no leakage of bright stars at grow 1 (docs/rv-correction.md
#     'Other existing steps')
#   - hybrid sky subtraction as PROCDIR_HYBW (median/tmpl, hybrid_wing = 3) plus hybrid_edge = 3
#   - rv_mode = interp as before (header mode waits for re-derived telluric constants)
# Row CM acts on the dc frames, so this needs the whole chain (reconstruction, hybrid second kmos_sci_red): about
# 20 h like the first PROCDIR_HYB IZ run, about 40 GB of dcr_ frames. Starts from the detector-corrected frames and
# calibrations of /local_storage/KOLJA/PROCDIR (linked by prepare_procdir_ohlin.py, no --reuse).
#
# On hqempower1 (after git pull):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hybr_IZ_test.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/IZrtest && cd /local_storage/KOLJA/hyb_work/IZrtest
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hybr_IZ_test.cfg > hybr_IZtest.out 2>&1
# Steps and checks: docs/procdir-hyb-server-run.md, 'IZ alternative: full re-run (PROCDIR_HYBR)'.

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HYBR
subdirs = KMOS.2026-02-12T06:02:50.540

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
row_commonmode_correct = True
row_commonmode_input = dc
# det 1 too (IFUs 1-8), with a pixel threshold det 1 reaches at grow 1
row_commonmode_dets = 1,2,3
row_commonmode_grow = 1
row_commonmode_minpix = 30

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
# barycentric correction: interp (resampling, as all earlier runs) so that the telluric step and its constants stay
# valid; 'header' (relabelling, docs/rv-correction.md) needs re-derived telluric constants first
rv_mode = interp
use_oh = True
oh_spec_iz = /local_storage/EMPOWER_raw_data/input_all/static/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
# IFU-wide median of the sky-only term in the OH-line wings (2-3 planes from a line core), docs/hybrid-sky.md
hybrid_wing = 3
# slitlet-end level of the sky-only term at the 3 end positions of every slitlet, smoothed along
# wavelength, in all planes without the 'pos' profile (docs/hybrid-sky.md 'Slitlet ends')
hybrid_edge = 3
