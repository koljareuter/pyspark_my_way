# Re-reduction of all YJ OBs with the hybrid sky subtraction for rotator-mismatched frames, on top of the
# OH-linear setup of kmos_server_ohlin_YJ.cfg (patched DRP, KMOS_LCORR_DEGREE=1, standard YJ OH_SPEC, default
# ZAP basis). 84 % of the YJ object time has its SKY frames at another rotator angle; there the classic O - S is
# 1.1-2.3x noisier per sqrt(t) (IFU 16 and 7/8 much worse in the blue).
#   - hybrid sky subtraction for OBJECT frames whose SKY frame is > 20 deg away (docs/hybrid-sky.md), with the
#     YJ model options hybrid_free_model = ifumed and hybrid_oh_model = pos3: the detector-level cube leaves
#     OH residuals in YJ that are about 10x larger than in IZ (flexure at the 90 deg rotator offset), shared by
#     the IFUs of a detector and changing towards the slitlet ends. Local test on two mismatched YJ OBs:
#     interior noise x0.22-0.65 of classic off the OH lines and x0.54-0.87 in the OH planes, central target
#     apertures x0.47-0.84 off the OH lines and x0.74-1.00 on them, star continua x0.996-1.003; at equal
#     kinematics the brighter lines gain S/N (1147707, 1123917, 1168518, H45), a few S/N~2-3 lines are lower.
#     Not tested yet at 36-54 deg (XMM2215, legac, cosmos_target_1).
#   - row common-mode correction of detectors 2 and 3 (dcr_ frames), as in the IZ run and the local test.
# Matched OBs (SKY at the OBJECT rotator angle) stay classic (no skysub_det cubes).
#
# Starts from the detector-corrected frames and calibrations of /local_storage/KOLJA/PROCDIR, linked by
# scripts/prepare_procdir_ohlin.py into PROCDIR_HYB/<OB>/ (the YJ OB folders are not used by the IZ/H runs there).
#
# On hqempower1 (after git pull):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hyb_YJ.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/YJ && cd /local_storage/KOLJA/hyb_work/YJ
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hyb_YJ.cfg > hyb_YJ.out 2>&1 &
# Steps and checks: docs/procdir-hyb-server-run.md, 'YJ'.
#
# 45 OB folders (all YJ OBs of the census with at least one sky exposure), as kmos_server_ohlin_YJ.cfg.

