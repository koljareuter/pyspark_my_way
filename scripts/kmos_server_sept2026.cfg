# Full reduction of the three September 2026 OBs (all YJ; some targets are
# re-observations, so their combinations must be redone afterwards).
#
# Raw folders: built from scripts/kmos_obs_sept2026.json (calibration tree per OB):
#   python scripts/lodo_sorting_algrithm.py --json scripts/kmos_obs_sept2026.json \
#       --dest /home/kreuter/kmos_ob_sorted --limit 0
#
# Usage on hqempower1 (from ~/pyspark_my_way, with nohup):
#   nohup env PYTHONPATH=. python scripts/reduce_kmos.py -p scripts/kmos_server_sept2026.cfg > sept2026.out 2>&1 &
# then the telluric post-step (TELLURIC_KMOS.*_YJ.fits is in each raw folder):
#   PYTHONPATH=. python scripts/apply_telluric_only.py -p scripts/kmos_server_sept2026.cfg
#
# Same settings as kmos_server_new.cfg, except:
#   * obsband = YJ only (no IZ/H frames in these OBs; YJ ZAP basis is fine)
#   * make_standard = False: the JSON contains no standard-star frames; the
#     telluric/response comes as a ready TELLURIC_*.fits file (post-step, NOT in
#     the kmos_sci_red SOF — telluric_in_sof = False, see project notes)

[instrument]
obsband = YJ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR
subdirs = KMOS.2026-09-12T04:54:06.466
          KMOS.2026-09-12T06:36:21.752
          KMOS.2026-09-15T03:38:04.353
[detector]
channel_correct = True
picture_correct = True
interchannel_correct = False
prefix = dc

[calibration]
make_dark = True
make_flat = True
make_arc = True
make_illum = True
reconstruct_arc = True
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
rvcorr = True
use_oh = True
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
