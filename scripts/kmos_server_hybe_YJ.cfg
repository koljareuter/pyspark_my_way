# YJ re-run with the slitlet-end fix of the hybrid sky subtraction (hybrid_edge = 3, docs/hybrid-sky.md
# 'Slitlet ends') on top of the finished PROCDIR_HYB run (pos3/ifumed, wing 3 stay). hybrid_edge changes only the sky subtraction, so the
# row-corrected dcr_ frames, the sky/ cubes and the skysub_det/ cubes of PROCDIR_HYB are reused (links, read only) and
# only subtract_sky -> illumination -> 2D background -> velocity correction run again (a few minutes per OB).
# Expected: the hot edge rows at the slitlet ends that the hybrid added go back to the classic level (locally: cubes
# with a slitlet-end offset > 3 sigma h21.4 48 % -> 0 %, SPT2040 81 % -> 52 % (classic 24 %)); noise elsewhere unchanged (x0.96-1.01). Matched OBs (no skysub_det
# cubes) take the unchanged classic path. rv_mode = interp as before, so the telluric step is unchanged (the
# header mode of docs/rv-correction.md waits for re-derived telluric constants).
#
# reconstruct_cubes = False, row_commonmode_correct = False and all [calibration] make_* = False are required
# (prepare_procdir_ohlin.py --reuse refuses the cfg otherwise). Do not write-protect PROCDIR_HYB.
#
# On hqempower1 (after git pull):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hybe_YJ.cfg \
#          --reuse /local_storage/KOLJA/PROCDIR_HYB
#   mkdir -p /local_storage/KOLJA/hyb_work/YJe && cd /local_storage/KOLJA/hyb_work/YJe
#   (smoke test in the foreground; the full run in the background)
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hybe_YJ.cfg > hybe_YJ.out 2>&1 &
# Steps and checks: docs/procdir-hyb-server-run.md, 'Slitlet-end + header-mode re-run (PROCDIR_HYBE)'.

