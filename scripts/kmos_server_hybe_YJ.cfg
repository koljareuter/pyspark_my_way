[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
# dcr_ frames are reused from PROCDIR_HYB
row_commonmode_correct = False
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
# sky/ and skysub_det/ cubes are reused from PROCDIR_HYB
reconstruct_cubes = False
sky_method = zapv2
rvcorr = True
# barycentric correction: interp (resampling, as all earlier runs) so that the telluric step and its constants stay
# valid; 'header' (relabelling, docs/rv-correction.md) needs re-derived telluric constants first
rv_mode = interp
use_oh = True
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
hybrid_bands = YJ
hybrid_wing = 3
# slitlet-end level of the sky-only term at the 3 end positions of every slitlet, smoothed along
# wavelength, in all planes without the 'pos' profile (docs/hybrid-sky.md 'Slitlet ends')
hybrid_edge = 3
# YJ: exact IFU median of D outside the OH cores; in the OH cores the slitlet median plus the position profile
# along the slitlet at the 3 end positions (median over the IFU's slitlets)
# (docs/hybrid-sky.md, 'YJ')
hybrid_free_model = ifumed
hybrid_oh_model = pos3
