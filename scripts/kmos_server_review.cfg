# Run custom-SVD (pipeline-review) on the two highest-SNR OBs from the server showcase:
#   Rank 1: KMOS.2026-01-14T02:40:14.860  IFU 5  SNR=81.3
#   Rank 2: KMOS.2026-01-12T09:16:07.233  IFU 6  SNR=51.3
#
# Usage on hqempower1 (from ~/pyspark_my_way, pipeline-review branch):
#   PYTHONPATH=. python scripts/rerun_from_sky.py -p scripts/kmos_server_review.cfg
#
# After: scp results back — see scripts/download_review.sh

[instrument]
obsband = YJ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /home/kreuter/kmos_ob_proc
subdirs = KMOS.2026-01-14T02:40:14.860,
          KMOS.2026-01-12T09:16:07.233

[detector]
channel_correct = True
picture_correct  = True
prefix           = dc

[cubes]
reconstruct_cubes = False
sky_method        = zapv2
rvcorr            = True
use_oh            = True
illum_corr        = True
bkg_corr          = True
telluric_in_sof   = True
get_star_params   = False
star_prefix       = None
