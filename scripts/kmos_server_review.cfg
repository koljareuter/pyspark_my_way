# Pipeline-review re-run: test improved sky subtraction on two representative OBs.
#   "Good":       KMOS.2026-01-12T09:16:07.233  (Jan 12, high-SNR OB, custom SVD confirmed)
#   "Middly bad": KMOS.2026-01-13T05:31:25.984  (Jan 13, mid-sequence, different night conditions)
#
# Usage on hqempower1 (from ~/pyspark_my_way, pipeline-review branch):
#   git pull && PYTHONPATH=. python scripts/rerun_from_sky.py -p scripts/kmos_server_review.cfg
#
# After: scp results back — see scripts/download_review.sh

[instrument]
obsband = YJ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /home/kreuter/kmos_ob_proc
subdirs = KMOS.2026-01-12T09:16:07.233,
          KMOS.2026-01-13T05:31:25.984

[detector]
channel_correct = True
picture_correct  = True
prefix           = dc

[cubes]
reconstruct_cubes = False
sky_method        = zapv2
rvcorr            = True
use_oh            = True
illum_corr        = True
bkg_corr          = True
telluric_in_sof   = True
get_star_params   = False
star_prefix       = None
