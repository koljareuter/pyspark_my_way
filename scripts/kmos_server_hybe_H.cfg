# H re-run with the barycentric correction by relabelling (rv_mode = header, docs/rv-correction.md,
# 2026-11-03) on top of the finished PROCDIR_OHLIN run (classic O - S, quadratic lcorr, standard OH_SPEC; no hybrid,
# no row common mode, own sky calibration angle; sky subtraction identical to PROCDIR_OHLIN). The sky/ cubes of
# PROCDIR_OHLIN are reused (links, read only) and subtract_sky -> illumination -> 2D background -> velocity correction
# run again (a few minutes per OB), so that H is in the same mode as IZ and YJ in PROCDIR_HYBE.
# Expected: identical to PROCDIR_OHLIN up to the missing barycentric resampling (lines sharper by the 19-26 km/s
# interpolation smoothing, per-pixel noise no longer correlated); the combined cubes stay in the telescope frame until
# scripts/telluric_combined.py (2026-11-03 version, frame index rebuilt from these frames) relabels them.
#
# reconstruct_cubes = False and all [calibration] make_* = False are required (prepare_procdir_ohlin.py --reuse).
#
# On hqempower1 (after git pull):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hybe_H.cfg \
#          --reuse /local_storage/KOLJA/PROCDIR_OHLIN
#   mkdir -p /local_storage/KOLJA/hyb_work/He && cd /local_storage/KOLJA/hyb_work/He
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hybe_H.cfg > hybe_H.out 2>&1 &
# Steps and checks: docs/procdir-hyb-server-run.md, 'Slitlet-end + header-mode re-run (PROCDIR_HYBE)'.

[instrument]
obsband = H

[pathing]
