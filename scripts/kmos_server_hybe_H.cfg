[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dc

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
# sky/ cubes are reused from PROCDIR_OHLIN
reconstruct_cubes = False
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_H_n500004_nomean.fits
rvcorr = True
# barycentric correction by relabelling instead of resampling: frames stay in the telescope frame,
# telluric_combined.py relabels the combined cube (docs/rv-correction.md)
rv_mode = header
use_oh = True
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
# quadratic on purpose (linear slightly worse in H); the patched DRP then equals the standard DRP
lcorr_degree = 2
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
