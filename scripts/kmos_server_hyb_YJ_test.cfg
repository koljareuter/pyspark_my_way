# Smoke test of kmos_server_hyb_YJ.cfg on ONE mismatched YJ OB (cosmos_0.6_0.8_h21.4, SKY frames 87-93 deg away),
# into the same procdir PROCDIR_HYB (the full run later produces the same files again). About 30-40 min.
# Expected afterwards (python scripts/prepare_procdir_ohlin.py scripts/kmos_server_hyb_YJ_test.cfg --status):
#   9 dc links, 9 dcr_ frames, 9 sky/ cubes, 6 skysub_det cubes, 6 final _rv cubes, degree 1;
#   in the OB log 'Hybrid sky: 6 of 6 OBJECT frames ...' and six '-- Hybrid sky subtraction with skysub_det/...'
#   lines ending '(wing 3, oh pos3, free ifumed)', no 'classic O - S' warning; --status 'wing' column
#   '6xW3/pos3/ifumed' (header keys ESO PYSPARK SKY HYBRID OHMODEL/FREEMODEL). If the log suffix is missing, or
#   --status has no 'wing' column or shows only '6xW3', the server code is older than the YJ options: git pull,
#   check git log -1 and run the smoke test again. Tested locally (WSL ~/impl_test/yjoh).
#
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hyb_YJ_test.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/YJtest && cd /local_storage/KOLJA/hyb_work/YJtest
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#       -p $HOME/pyspark_my_way/scripts/kmos_server_hyb_YJ_test.cfg > hyb_YJtest.out 2>&1

[instrument]
obsband = YJ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HYB
subdirs = KMOS.2026-02-11T06:31:26.207

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
row_commonmode_correct = True
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
rvcorr = True
use_oh = True
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
hybrid_bands = YJ
hybrid_wing = 3
# YJ: exact IFU median of D outside the OH cores; in the OH cores the slitlet median plus the position profile
# along the slitlet at the 3 end positions (median over the IFU's slitlets)
# (docs/hybrid-sky.md, 'YJ')
hybrid_free_model = ifumed
hybrid_oh_model = pos3
