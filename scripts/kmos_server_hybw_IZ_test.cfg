# Smoke test of kmos_server_hybw_IZ.cfg on ONE IZ OB (cosmos_0.6_0.8_h21.4, SKY frames 87-93 deg away), into the
# same procdir PROCDIR_HYBW (the full run later produces the same files again). A few minutes.
# Expected afterwards (python scripts/prepare_procdir_ohlin.py scripts/kmos_server_hybw_IZ_test.cfg --status):
#   9 dc links, 9 dcr links, 9 sky/ links, 6 skysub_det links, 6 final _rv cubes, wing '6xW3', OH_SPEC/degree
#   of PROCDIR_HYB marked *; in the OB log (PROCDIR_HYBW/<OB>/*_IZ_*.log) six '-- Hybrid sky subtraction with
#   skysub_det/...' lines and no 'classic O - S' warning; in hybw_IZtest.out '- Running reconstruction' and
#   '-- Finished reconstruction' in the same second (reconstruct_cubes = False: no kmos_sci_red call).
#
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hybw_IZ_test.cfg \
#          --reuse /local_storage/KOLJA/PROCDIR_HYB
#   mkdir -p /local_storage/KOLJA/hyb_work/IZwtest && cd /local_storage/KOLJA/hyb_work/IZwtest
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#       -p $HOME/pyspark_my_way/scripts/kmos_server_hybw_IZ_test.cfg > hybw_IZtest.out 2>&1

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HYBW
subdirs = KMOS.2026-02-12T06:02:50.540

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
# dcr_ frames are reused from PROCDIR_HYB
row_commonmode_correct = False
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
# sky/ and skysub_det/ cubes are reused from PROCDIR_HYB
reconstruct_cubes = False
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
use_oh = True
oh_spec_iz = /local_storage/EMPOWER_raw_data/input_all/static/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
# IFU-wide median of the sky-only term in the OH-line wings (2-3 planes from a line core), docs/hybrid-sky.md
hybrid_wing = 3
