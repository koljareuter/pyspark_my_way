# Re-reduction of all H OBs into PROCDIR_HYB with the H-band noise fixes of October 2026, on top of the
# PROCDIR_OHLIN setup (quadratic OH lambda correction, standard kmos_oh_spec_h.fits):
#   - SKY frames reconstructed with the calibrations of their OBJECT frames' rotator angle
#     (sky_cal_angle = object; H +5-11 % per frame, docs/noise-improvements-2026-10.md)
# No hybrid sky subtraction (makes H 1.3-3.3x worse, docs/hybrid-sky.md), no row common-mode correction
# (no gain in H) and no snap_wcs (+2 % at best in H, PSF wider; not adopted after the IZ end-to-end test).
#
# On hqempower1:
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hyb_H.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/H && cd /local_storage/KOLJA/hyb_work/H
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hyb_H.cfg > hyb_H.out 2>&1 &
#
# 18 OB folders (all H OBs of the census with at least one sky exposure), as kmos_server_ohlin_H.cfg.

[instrument]
obsband = H

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
