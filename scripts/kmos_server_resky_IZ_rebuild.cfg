# IZ OB folders whose un-sky-subtracted cubes (PROCDIR/<OB>/sky/) are missing on the
# server: redo detector correction + cube reconstruction from the raw frames (existing
# calibrations in PROCDIR/<OB>/calib/ are re-used, NOT recomputed), then sky
# subtraction with the corrected ZAP eigenbasis and all later steps.
# See docs/zap-iz-svd-mean-bug.md.  Same settings as the original reduction
# (kmos_server_new.cfg) except: calibrations off, svd_path set.
#
# One band per file on purpose: svd_path applies to every band of a run, so this file
# must never contain YJ.
#
# On hqempower1, from ~/pyspark_my_way:
#   git pull
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_IZ_rebuild.cfg            # preflight
#   python scripts/check_resky_ready.py scripts/kmos_server_resky_IZ_rebuild.cfg --backup   # optional copy of old *_rv.fits
#   nohup env PYTHONPATH=. python scripts/reduce_kmos.py -p scripts/kmos_server_resky_IZ_rebuild.cfg > resky_IZ_rebuild.out 2>&1 &
#
# 7 OB folders (COSMOS + GOODS/CDFS, January-February 2026).

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR
subdirs = KMOS.2026-01-13T02:54:58.606
          KMOS.2026-01-13T03:42:28.829
          KMOS.2026-01-14T00:54:55.251
          KMOS.2026-01-14T01:42:33.717
          KMOS.2026-01-14T06:26:45.312
          KMOS.2026-01-14T07:14:41.408
          KMOS.2026-01-14T08:02:33.336

[detector]
channel_correct = True
picture_correct = True
interchannel_correct = False
prefix = dc

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
use_oh = True
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
