# Re-reduction of all H OBs into PROCDIR_OHLIN, together with IZ and YJ, but with the DRP's QUADRATIC
# OH-line wavelength correction (lcorr_degree = 2): in H the linear fit was slightly worse (local check
# 2026-10-21, docs/oh-lcorr-linear-rereduction.md). The sky/ cubes are therefore the current ones bit by bit;
# the run only puts H into the same folder tree for the combination.
# OH_SPEC: the standard kmos_oh_spec_h.fits (38 usable lines across the band).
#
# Starts from the detector-corrected frames and calibrations of /local_storage/KOLJA/PROCDIR, which
# scripts/prepare_procdir_ohlin.py links (one hop, absolute) into PROCDIR_OHLIN/<OB>/. Everything is
# written to PROCDIR_OHLIN; PROCDIR and kmos_ob_sorted are only read.
#
# One band per file on purpose (svd_path, oh_spec_<band> and lcorr_degree apply to the whole run).
# Run each band from its own working directory: kmos_sci_red writes its products and the temporary
# .sof into the current directory, and a failing OB deletes every *.sof there.
#
# On hqempower1 (after build_kmos_lcorr_drp.sh build + smoke and prepare_procdir_ohlin.py):
#   mkdir -p /local_storage/KOLJA/ohlin_work/H && cd /local_storage/KOLJA/ohlin_work/H
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_ohlin_H.cfg > ohlin_H.out 2>&1 &
#
# 18 OB folders (all H OBs of the census with at least one sky exposure).

[instrument]
obsband = H

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_OHLIN
subdirs = KMOS.2026-06-07T07:24:38.627
          KMOS.2026-06-07T08:45:18.095
