[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
reconstruct_cubes = True
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_H_n500004_nomean.fits
rvcorr = True
use_oh = True
