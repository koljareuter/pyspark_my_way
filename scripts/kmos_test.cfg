# Test config for reduce_kmos.py, driving a trial run with telluric
# correction against the OB-sorted symlink tree built by
# lodo_sorting_algrithm.py from kmos_ob_structure.json (one folder per OB,
# not per night -- each folder holds exactly one matching telluric file).
#
# rawdir/procdir below are your own home directory on empower.hq.eso.org
# (per the `~` in your ssh prompt) -- adjust if you'd rather use somewhere
# else you own.
#
# Build rawdir first, from your own account on the server:
#   python3 lodo_sorting_algrithm.py --json kmos_ob_structure.json --limit 0 \
#       --dest /home/kreuter/kmos_ob_sorted
#
# subdirs below are the 20 OBs belonging to the same 3 test nights used
# before (2026-01-12/13/14), listed individually since the sort now happens
# per OB rather than per night.
#
# Can handle multiple comma-separated bands
[instrument]
obsband = IZ,YJ,H


# rawdir and procdir should correspond to parent
# input/output directories, while subdirs should
# be e.g. nightly folders
[pathing]
rawdir = /home/kreuter/kmos_ob_sorted
procdir = /home/kreuter/kmos_ob_proc
subdirs = KMOS.2026-01-12T05:36:55.243
          KMOS.2026-01-12T06:45:08.816
          KMOS.2026-01-12T07:43:30.915
          KMOS.2026-01-12T08:40:54.192
          KMOS.2026-01-12T09:16:07.233
          KMOS.2026-01-13T02:54:58.606
          KMOS.2026-01-13T03:42:28.829
          KMOS.2026-01-13T04:40:23.303
          KMOS.2026-01-13T05:31:25.984
          KMOS.2026-01-13T06:31:57.158
          KMOS.2026-01-13T07:19:42.798
          KMOS.2026-01-13T08:07:27.815
          KMOS.2026-01-14T00:54:55.251
          KMOS.2026-01-14T01:42:33.717
          KMOS.2026-01-14T02:40:14.860
          KMOS.2026-01-14T04:24:47.207
          KMOS.2026-01-14T05:23:13.608
          KMOS.2026-01-14T06:26:45.312
          KMOS.2026-01-14T07:14:41.408
          KMOS.2026-01-14T08:02:33.336


# this section controls detector level corrections.  Output files
# are written to procdir with prefix prependend (defaults to dc)
[detector]
channel_correct = True
picture_correct = True
interchannel_correct = False
prefix = dc


# flag which calibration steps to run note that in general you
# must run *all* calibraion steps as they're interdependent.  darkexp
# gives a dark exposure time to search for, and is provided for
# compatibility with older observations where the darks matched the
# the science exposure time.  Defaults to 60s in case no darks with
# the request time are found (or if darkexp not given)
[calibration]
make_dark = True
make_flat = True
make_arc = True
make_illum = True
reconstruct_arc = True
make_standard = True
darkexp = 300


# valid options for sky_method are zapv1, zapv2, spark,
# or zap_det (not yet implemented)
[cubes]
reconstruct_cubes = True
sky_method = zapv2
rvcorr = True
use_oh = True
illum_corr = True
bkg_corr = True
telluric_in_sof = True
get_star_params = False
star_prefix = None
