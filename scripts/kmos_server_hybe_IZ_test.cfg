# IZ smoke test (1 OB) re-run with the slitlet-end fix of the hybrid sky subtraction (hybrid_edge = 3, docs/hybrid-sky.md
# 'Slitlet ends') on top of the finished PROCDIR_HYB run (the OH-wing setting of PROCDIR_HYBW, hybrid_wing = 3, stays). hybrid_edge changes only the sky subtraction, so the
# row-corrected dcr_ frames, the sky/ cubes and the skysub_det/ cubes of PROCDIR_HYB are reused (links, read only) and
# only subtract_sky -> illumination -> 2D background -> velocity correction run again (a few minutes per OB).
# Expected: the hot edge rows at the slitlet ends that the hybrid added go back to the classic level (locally: cubes
# with a slitlet-end offset > 3 sigma h21.4 33 % -> 5 %, classic 0 %); noise elsewhere unchanged (x0.96-1.01). Matched OBs (no skysub_det
# cubes) take the unchanged classic path. rv_mode = interp as before, so the telluric step is unchanged (the
# header mode of docs/rv-correction.md waits for re-derived telluric constants).
#
# reconstruct_cubes = False, row_commonmode_correct = False and all [calibration] make_* = False are required
# (prepare_procdir_ohlin.py --reuse refuses the cfg otherwise). Do not write-protect PROCDIR_HYB.
#
# On hqempower1 (after git pull):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_hybe_IZ_test.cfg \
#          --reuse /local_storage/KOLJA/PROCDIR_HYB
#   mkdir -p /local_storage/KOLJA/hyb_work/IZetest && cd /local_storage/KOLJA/hyb_work/IZetest
#   (smoke test in the foreground; the full run in the background)
#   env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_hybe_IZ_test.cfg > hybe_IZtest.out 2>&1
# Steps and checks: docs/procdir-hyb-server-run.md, 'Slitlet-end + header-mode re-run (PROCDIR_HYBE)'.

[instrument]
obsband = IZ

[pathing]
rawdir  = /home/kreuter/kmos_ob_sorted
procdir = /local_storage/KOLJA/PROCDIR_HYBE
subdirs = KMOS.2026-02-12T06:02:50.540

[detector]
channel_correct = False
picture_correct = False
interchannel_correct = False
prefix = dcr
# dcr_ frames are reused from PROCDIR_HYB
row_commonmode_correct = False
row_commonmode_input = dc
row_commonmode_dets = 2,3
row_commonmode_grow = 1
row_commonmode_minpix = 150

[calibration]
make_dark = False
make_flat = False
make_arc = False
make_illum = False
reconstruct_arc = False
make_standard = False
darkexp = 300

[cubes]
# sky/ and skysub_det/ cubes are reused from PROCDIR_HYB
reconstruct_cubes = False
sky_method = zapv2
svd_path = /home/kreuter/pyspark_my_way/pyspark/data/ZAPv2_SVD_IZ_n500004_nomean.fits
rvcorr = True
# barycentric correction: interp (resampling, as all earlier runs) so that the telluric step and its constants stay
# valid; 'header' (relabelling, docs/rv-correction.md) needs re-derived telluric constants first
rv_mode = interp
use_oh = True
oh_spec_iz = /local_storage/EMPOWER_raw_data/input_all/static/kmos_oh_spec_iz_NEW.fits
recipe_dir = /home/kreuter/KMOS_PIPELINE_4.5.11_lcorr/install/lib/esopipes-plugins
lcorr_degree = 1
illum_corr = True
bkg_corr = True
telluric_in_sof = False
get_star_params = False
star_prefix = None
hybrid_sky = True
hybrid_min_dangle = 20
# IFU-wide median of the sky-only term in the OH-line wings (2-3 planes from a line core), docs/hybrid-sky.md
hybrid_wing = 3
# slitlet-end level of the sky-only term at the 3 end positions of every slitlet, smoothed along
# wavelength, in all planes without the 'pos' profile (docs/hybrid-sky.md 'Slitlet ends')
hybrid_edge = 3
