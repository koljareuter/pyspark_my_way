# Re-reduction of all H OBs into PROCDIR_HALN: kmos_server_hyb_H.cfg (PROCDIR_OHLIN setup, sky_cal_angle = object)
# plus the slitlet-end alignment of the SKY frames (sky_align = True; docs/hybrid-sky.md 'Sky lines at the slitlet ends').
# Cause of the one-plane sky-line spikes/dips in the 2-3 slitlet-end rows of the H cubes (OHLIN H 51 % of the combined
# cubes with an edge row > 5 sigma, PROCDIR_HYB H 98 %): the slitlet traces move along the slitlet with the rotator angle
# (flexure, up to ~1.5 px), so O and S (S taken 76-89 deg away) have their slitlet ends at different detector columns.
# sky_align fits, per O-S pair, the sky-shaped part of that shift at the 3 end pixels of every slitlet of the SKY frame,
# adds it to a copy of the SKY frame (no pixel is moved, nothing of the OBJECT frame changes) and reconstructs the copy
# with the OBJECT frame's angle into <OB>/sky_align/; subtract_sky uses it for the classic O - S + ZAPv2.
# Local test (KMOS.2026-06-07T07:24:38.627, 6-frame stack; docs/hybrid-sky.md): oh_rows median edge maximum 27.7 sigma
# (object angle) -> 1.6, interior noise as object angle. Cost: one extra kmos_sci_red run per OB (one SKY cube per
# OBJECT frame, 34 MB each in sky_align/) and ~1-2 min of Python per OBJECT frame.
# Everything else as kmos_server_hyb_H.cfg; rv_mode = interp (the default, as PROCDIR_OHLIN/HYB).
#
# On hqempower1 (after git pull; full chain from the dc frames, no --reuse):
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_haln_H.cfg --dry-run
#   python $HOME/pyspark_my_way/scripts/prepare_procdir_ohlin.py $HOME/pyspark_my_way/scripts/kmos_server_haln_H.cfg
#   mkdir -p /local_storage/KOLJA/hyb_work/Haln && cd /local_storage/KOLJA/hyb_work/Haln
#   nohup env PYTHONPATH=$HOME/pyspark_my_way python $HOME/pyspark_my_way/scripts/reduce_kmos.py \
#         -p $HOME/pyspark_my_way/scripts/kmos_server_haln_H.cfg > haln_H.out 2>&1 &
# Smoke test first: kmos_server_haln_H_test.cfg. Steps and checks: docs/procdir-hyb-server-run.md, 'Slitlet-end alignment
# run (PROCDIR_HALN, H)'.
#
# 18 OB folders (all H OBs of the census with at least one sky exposure), as kmos_server_hyb_H.cfg.

